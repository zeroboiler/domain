name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest

    name: Code Quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMPOSER_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, ctype, json, bcmath
          tools: composer:v2

      - name: Resolve private dependencies
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Clone dependency chain: domain → events, dto, enums, value-objects
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/value-objects.git /tmp/value-objects
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/dto.git /tmp/dto
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/enums.git /tmp/enums
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/events.git /tmp/events
          # Inject version fields for path-based packages that lack them
          php -r "
            \$repos = [
              '/tmp/value-objects' => '1.1.0',
              '/tmp/dto' => '1.1.0',
              '/tmp/enums' => '1.0.0',
              '/tmp/events' => '1.0.0',
            ];
            foreach (\$repos as \$dir => \$ver) {
              \$f = \$dir . '/composer.json';
              \$j = json_decode(file_get_contents(\$f), true);
              if (empty(\$j['version'])) {
                \$j['version'] = \$ver;
                file_put_contents(\$f, json_encode(\$j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . \"\n\");
                echo \"Set \$f version to \$ver\n\";
              }
            }
          "

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run Rector (dry-run)
        run: vendor/bin/rector process --dry-run

  test:
    runs-on: ubuntu-latest

    name: Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMPOSER_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, ctype, json, bcmath
          tools: composer:v2, pint, phpstan, rector, pest

      - name: Resolve private dependencies
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/value-objects.git /tmp/value-objects
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/dto.git /tmp/dto
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/enums.git /tmp/enums
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/events.git /tmp/events
          php -r "
            \$repos = [
              '/tmp/value-objects' => '1.1.0',
              '/tmp/dto' => '1.1.0',
              '/tmp/enums' => '1.0.0',
              '/tmp/events' => '1.0.0',
            ];
            foreach (\$repos as \$dir => \$ver) {
              \$f = \$dir . '/composer.json';
              \$j = json_decode(file_get_contents(\$f), true);
              if (empty(\$j['version'])) {
                \$j['version'] = \$ver;
                file_put_contents(\$f, json_encode(\$j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . \"\n\");
                echo \"Set \$f version to \$ver\n\";
              }
            }
          "

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run Tests
        run: vendor/bin/pest --coverage

      - name: Check coverage
        run: vendor/bin/pest --min=80