name: Auto-fix

on:
  push:
    branches: [main, develop]

jobs:
  auto-fix:
    runs-on: ubuntu-latest

    name: Auto-fix Code Style

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, ctype, json, bcmath
          tools: composer:v2


      - name: Configure git and composer auth
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN }}
        run: |
          git config --global url."https://${COMPOSER_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${COMPOSER_TOKEN}@github.com/".insteadOf "git@github.com:"
          composer config -g github-oauth.github.com "${COMPOSER_TOKEN}"


      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run Pint
        run: vendor/bin/pint

      - name: Run Rector
        run: vendor/bin/rector process

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet && git diff --staged --quiet || git commit -am "Auto-fix: code style and improvements"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}