name: Auto-fix

on:
  push:
    branches: [main, develop]

jobs:
  auto-fix:
    runs-on: ubuntu-latest

    name: Auto-fix Code Style

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, ctype, json, bcmath
          tools: composer:v2

      - name: Resolve private dependencies
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/value-objects.git /tmp/value-objects
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/dto.git /tmp/dto
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/enums.git /tmp/enums
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/events.git /tmp/events
          php -r "
            \$repos = [
              '/tmp/value-objects' => '1.1.0',
              '/tmp/dto' => '1.1.0',
              '/tmp/enums' => '1.0.0',
              '/tmp/events' => '1.0.0',
            ];
            foreach (\$repos as \$dir => \$ver) {
              \$f = \$dir . '/composer.json';
              \$j = json_decode(file_get_contents(\$f), true);
              if (empty(\$j['version'])) {
                \$j['version'] = \$ver;
                file_put_contents(\$f, json_encode(\$j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . \"\n\");
                echo \"Set \$f version to \$ver\n\";
              }
            }
          "

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run Pint
        run: vendor/bin/pint

      - name: Run Rector
        run: vendor/bin/rector process

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet && git diff --staged --quiet || git commit -am "Auto-fix: code style and improvements"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}